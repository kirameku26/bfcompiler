name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Test
        run: cargo +stable test --locked --all-targets

      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

  windows:
    name: Windows x86-64 (GNU)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      - name: Install Rust GNU toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: Test
        shell: msys2 {0}
        env:
          BFC_CC: gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: |
          cargo +stable-x86_64-pc-windows-gnu test --locked --all-targets