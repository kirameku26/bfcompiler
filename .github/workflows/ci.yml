name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Test
        run: cargo +stable test --locked --all-targets

      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

  linux-cross:
    name: Linux cross (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686
            compiler: gcc-i686-linux-gnu
            libc: libc6-dev-i386-cross
          - target: riscv64
            compiler: gcc-riscv64-linux-gnu
            libc: libc6-dev-riscv64-cross
    steps:
      - uses: actions/checkout@v6

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user ${{ matrix.compiler }} ${{ matrix.libc }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cross-compile and run Linux programs
        env:
          BFC_TEST_LINUX_CROSS: ${{ matrix.target }}
        run: cargo +stable test --locked --test cross_linux --test fixtures -- --nocapture

  macos:
    name: macOS (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      # The ARM64 E2E suite also executes Intel binaries.
      - name: Ensure Rosetta is available
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup target add --toolchain stable ${{ matrix.target }}

      - name: Check formatting
        run: rustup run stable cargo fmt --check

      - name: Test
        run: rustup run stable cargo test --locked --all-targets --target ${{ matrix.target }}

      - name: Clippy
        run: rustup run stable cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings

  windows:
    name: Windows x86-64 (GNU)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      - name: Install Rust GNU toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: Test
        shell: msys2 {0}
        env:
          BFC_CC: gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: |
          cargo +stable-x86_64-pc-windows-gnu test --locked --all-targets
